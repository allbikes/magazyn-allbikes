<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL BIKES — Dostępność</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f8fafc;color:#111827;font-family:system-ui,sans-serif;font-size:13px;}
header{background:#fff;border-bottom:2px solid #1a56db;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.07);}
.logo{font-size:1.3rem;font-weight:800;color:#1a56db;}.logo span{color:#111;}
.sub{font-size:.68rem;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-top:1px;}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center;}
input{background:#fff;border:1px solid #dde3ea;border-radius:5px;padding:6px 11px;font-size:.82rem;width:190px;outline:none;}
input:focus{border-color:#1a56db;}
input::placeholder{color:#9ca3af;}
.dot{width:6px;height:6px;border-radius:50%;background:#16a34a;animation:p 2s infinite;}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.live{font-size:.65rem;color:#16a34a;font-weight:700;text-transform:uppercase;}
.upd{font-size:.65rem;color:#6b7280;font-style:italic;}
.tw{background:#fff;border-bottom:1px solid #dde3ea;position:sticky;top:57px;z-index:99;overflow-x:auto;}
.tw::-webkit-scrollbar{height:3px;}.tw::-webkit-scrollbar-thumb{background:#dde3ea;}
.tabs{display:flex;padding:0 16px;min-width:max-content;}
.tab{padding:10px 13px;font-size:.72rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border:none;background:transparent;color:#6b7280;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;}
.tab:hover{color:#111;}.tab.act{color:#1a56db;border-bottom-color:#1a56db;}
.n{background:#f0f2f5;border-radius:20px;padding:1px 5px;font-size:.62rem;margin-left:3px;}
.tab.act .n{background:#dbeafe;color:#1a56db;}
main{padding:16px 20px;}
.info{font-size:.72rem;color:#6b7280;margin-bottom:10px;}
.info strong{color:#1a56db;}
.wrap{overflow-x:auto;border-radius:8px;border:1px solid #dde3ea;}
table{width:100%;border-collapse:collapse;background:#fff;}
thead th{padding:9px 12px;text-align:left;font-size:.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #e5e7eb;background:#f8fafc;white-space:nowrap;}
tbody tr{border-bottom:1px solid #f1f5f9;transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#f8fafc;}
tbody td{padding:8px 12px;vertical-align:middle;}
.mn{font-weight:600;font-size:.85rem;line-height:1.4;}
.kb{font-family:monospace;font-size:.78rem;background:#f1f5f9;padding:2px 6px;border-radius:3px;border:1px solid #e5e7eb;}
.q{font-size:.85rem;font-weight:700;}
.q.hi{color:#16a34a;}.q.md{color:#d97706;}.q.lo{color:#dc2626;}.q.ze{color:#9ca3af;}
.ms{color:#dc2626;font-weight:700;}
.gimg{display:inline-flex;align-items:center;gap:4px;color:#1a56db;font-size:.75rem;text-decoration:none;padding:4px 10px;border:1px solid #bfdbfe;border-radius:5px;background:#eff6ff;transition:all .15s;white-space:nowrap;}
.gimg:hover{background:#dbeafe;border-color:#93c5fd;}
.gimg svg{width:11px;height:11px;flex-shrink:0;}
.empty{text-align:center;padding:50px;color:#9ca3af;font-size:.85rem;}
.loader{text-align:center;padding:50px;color:#6b7280;font-size:.85rem;}
.no-data{text-align:center;padding:60px 20px;color:#9ca3af;}
.no-data .ic{font-size:2.5rem;margin-bottom:10px;display:block;}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">ALL <span>BIKES</span></div>
    <div class="sub">Dostępność rowerów</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px;">
    <div style="display:flex;align-items:center;gap:5px;"><div class="dot"></div><span class="live">Live</span></div>
    <span class="upd" id="upd">Ładowanie...</span>
  </div>
  <div class="hr">
    <input type="text" id="gs" placeholder="🔍 Szukaj modelu lub kodu..." oninput="fr()">
  </div>
</header>
<div class="tw"><div class="tabs" id="tc"></div></div>
<main>
  <div class="info" id="info"></div>
  <div id="tbl"><div class="loader">⏳ Pobieranie danych...</div></div>
</main>

<script>
// ── Czyta z arkusza klienta (zatwierdzone przez admina) ──────────────
const CLIENT_ID = '1ZwvkB1uDlDg57ojNAiS_mSc4Sy9OSPclGa7OZDFnTt8';
const TTL = 5 * 60 * 1000;

let allData = {}, cur = '', sq = '';
const cache = {};

// ── CSV ───────────────────────────────────────────────────────────────
function csv(txt){
  return txt.split('\n').map(l=>{
    const c=[];let s='',q=false;
    for(const ch of l){if(ch==='"'){q=!q;continue;}if(ch===','&&!q){c.push(s.trim());s='';continue;}s+=ch;}
    c.push(s.trim());return c;
  }).filter(r=>r.some(c=>c));
}

// ── FETCH CLIENT SHEET ────────────────────────────────────────────────
async function fetchAll(force=false){
  const cached=cache['all'];
  if(!force&&cached&&Date.now()-cached.ts<TTL)return cached.data;

  // Pobierz opublikowany CSV z arkusza klienta
  const r=await fetch(`https://docs.google.com/spreadsheets/d/e/2PACX-1vTml4e5AX1A8gx4Us2IU_3zsBb0qAIb-572OoZPDUN7kh3As_-HjCPmqy9-KeLrzwVxrGwu6Emh-bu9/pub?output=csv`);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const rows=csv(await r.text());
  if(!rows.length)return{};

  // Struktura: Marka | Model | Kod | Ilość
  const hdr=rows[0].map(c=>c.toLowerCase());
  const bi=hdr.indexOf('marka'), mi=hdr.indexOf('model'), ki=hdr.indexOf('kod'), ii=hdr.findIndex(c=>c.includes('ilo'));
  const data={};
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    const brand=(r[bi]||'').trim();
    const model=(r[mi]||'').trim();
    const kod=(r[ki]||'').trim();
    const ilosc=(r[ii]||'').trim();
    if(!brand||!model)continue;
    if(!data[brand])data[brand]=[];
    data[brand].push({m:model,k:kod||'?',il:ilosc||'?'});
  }
  cache['all']={data,ts:Date.now()};
  return data;
}

// ── RENDER ────────────────────────────────────────────────────────────
function qcl(v){const n=parseInt(v);if(isNaN(n)||v==='?')return'';if(n===0)return'ze';if(n>=4)return'hi';if(n>=2)return'md';return'lo';}

function render(){
  const bikes=(allData[cur]||[]);
  const f=sq?bikes.filter(b=>b.m.toLowerCase().includes(sq.toLowerCase())||b.k.toLowerCase().includes(sq.toLowerCase())):bikes;
  document.getElementById('info').innerHTML=`Dostępne modele: <strong>${f.length}</strong>`;
  if(!f.length){
    document.getElementById('tbl').innerHTML=sq
      ?`<div class="empty">Brak wyników dla "<em>${sq}</em>"</div>`
      :`<div class="no-data"><span class="ic">📋</span>Brak danych dla tej marki</div>`;
    return;
  }
  let h=`<div class="wrap"><table><thead><tr>
    <th style="width:130px">Zdjęcie</th><th>Model</th><th>Kod</th><th>Ilość dostępna</th>
  </tr></thead><tbody>`;
  f.forEach((b,i)=>{
    const qc=qcl(b.il);
    const q=b.il==='?'?'<span class="ms">?</span>':`<span class="q ${qc}">${b.il}&nbsp;szt.</span>`;
    const k=b.k==='?'?'<span class="ms">?</span>':`<span class="kb">${b.k}</span>`;
    h+=`<tr>
      <td><a class="gimg" href="https://www.google.com/search?q=${encodeURIComponent(b.m+' rower')}&tbm=isch" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Szukaj zdjęcia
      </a></td>
      <td><div class="mn">${b.m}</div></td>
      <td>${k}</td>
      <td>${q}</td>
    </tr>`;
  });
  h+='</tbody></table></div>';
  document.getElementById('tbl').innerHTML=h;
}

// ── TABS ──────────────────────────────────────────────────────────────
function buildTabs(brands){
  const c=document.getElementById('tc');c.innerHTML='';
  brands.forEach((brand,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===0?' act':'');
    const cnt=(allData[brand]||[]).length;
    b.innerHTML=brand+`<span class="n">${cnt}</span>`;
    b.onclick=()=>{
      cur=brand;sq='';document.getElementById('gs').value='';
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('act'));
      b.classList.add('act');render();
    };
    c.appendChild(b);
  });
}

// ── LOAD ──────────────────────────────────────────────────────────────
async function loadAll(force=false){
  document.getElementById('tbl').innerHTML=`<div class="loader">⏳ Wczytywanie...</div>`;
  try{
    allData=await fetchAll(force);
    const brands=Object.keys(allData);
    if(!brands.length){
      document.getElementById('tbl').innerHTML=`<div class="no-data"><span class="ic">📋</span>Brak opublikowanych danych.<br>Admin nie opublikował jeszcze żadnych rowerów.</div>`;
      return;
    }
    if(!cur||!brands.includes(cur))cur=brands[0];
    buildTabs(brands);
    document.getElementById('upd').textContent='Stan na: '+new Date().toLocaleTimeString('pl-PL');
    render();
  }catch(e){
    document.getElementById('tbl').innerHTML=`<div class="empty">⚠️ Błąd ładowania. <a href="#" onclick="loadAll(true);return false">Odśwież</a></div>`;
  }
}
function fr(){sq=document.getElementById('gs').value;render();}
setInterval(()=>{if(document.visibilityState==='visible')loadAll(true);},TTL);
loadAll();
</script>
</body>
</html>
