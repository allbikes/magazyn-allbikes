<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL BIKES Admin</title>
<style>
:root{--bg:#f0f4f8;--s:#fff;--s2:#f4f6f9;--bdr:#dde3ea;--acc:#1a56db;--txt:#111827;--mut:#6b7280;--grn:#16a34a;--yel:#d97706;--red:#dc2626;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;font-size:13px;}

header{background:#fff;border-bottom:2px solid var(--acc);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.logo{font-size:1.25rem;font-weight:800;color:var(--acc);}.logo span{color:#111;}
.abadge{font-size:.62rem;background:#fef3c7;color:#92400e;border:1px solid #fde68a;border-radius:4px;padding:2px 7px;font-weight:700;letter-spacing:.5px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--grn);animation:p 2s infinite;}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.upd{font-size:.65rem;color:var(--mut);font-style:italic;}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
input[type=text]{background:#fff;border:1px solid var(--bdr);border-radius:5px;padding:6px 10px;font-size:.82rem;width:190px;outline:none;}
input[type=text]:focus{border-color:var(--acc);}
input::placeholder{color:#9ca3af;}
.pill{background:var(--s2);border:1px solid var(--bdr);border-radius:20px;padding:3px 10px;font-size:.72rem;color:var(--mut);}
.pill strong{color:var(--acc);}

.pub-btn{background:var(--grn);border:none;border-radius:6px;padding:7px 16px;color:#fff;font-size:.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .15s;white-space:nowrap;}
.pub-btn:hover{opacity:.88;}
.pub-btn:disabled{opacity:.5;cursor:not-allowed;}
.pub-btn svg{width:13px;height:13px;}
.pub-btn.loading svg{animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.ref-btn{background:#fff;border:1px solid var(--bdr);border-radius:5px;padding:6px 11px;font-size:.75rem;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;}
.ref-btn:hover{border-color:var(--acc);color:var(--acc);}
.ref-btn svg{width:11px;height:11px;}
.ref-btn.spin svg{animation:spin 1s linear infinite;}

/* SCRIPT URL BANNER */
.banner{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 16px;margin:14px 20px 0;font-size:.8rem;color:#92400e;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.banner input{background:#fff;border:1px solid #fbbf24;border-radius:5px;padding:5px 10px;font-size:.78rem;width:420px;outline:none;font-family:monospace;}
.banner input:focus{border-color:#d97706;}
.banner input.ok{border-color:var(--grn);background:#f0fdf4;}
.save-url-btn{background:#d97706;border:none;border-radius:5px;padding:5px 12px;color:#fff;font-size:.75rem;cursor:pointer;white-space:nowrap;}

/* TABS */
.tw{background:#fff;border-bottom:1px solid var(--bdr);position:sticky;top:57px;z-index:100;overflow-x:auto;}
.tw::-webkit-scrollbar{height:3px;}.tw::-webkit-scrollbar-thumb{background:var(--bdr);}
.tabs{display:flex;padding:0 16px;min-width:max-content;}
.tab{padding:10px 13px;font-size:.72rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border:none;background:transparent;color:var(--mut);border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;}
.tab:hover{color:var(--txt);}
.tab.act{color:var(--acc);border-bottom-color:var(--acc);}
.n{background:var(--s2);border-radius:20px;padding:1px 5px;font-size:.62rem;margin-left:3px;}
.tab.act .n{background:#dbeafe;color:var(--acc);}
.tab.er{color:var(--red)!important;}

main{padding:14px 20px;}
.tb2{display:flex;gap:7px;margin-bottom:12px;align-items:center;flex-wrap:wrap;}
.sl{color:var(--mut);font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;}
.sb{padding:4px 10px;border-radius:4px;border:1px solid var(--bdr);background:#fff;color:var(--mut);font-size:.72rem;cursor:pointer;transition:all .15s;}
.sb:hover{border-color:var(--acc);}
.sb.act{background:#eff6ff;border-color:var(--acc);color:var(--acc);font-weight:600;}
.ri{margin-left:auto;color:var(--mut);font-size:.72rem;}

/* PUBLISH STATUS */
.pub-status{display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:6px;font-size:.8rem;margin-bottom:12px;}
.pub-status.ok{display:flex;background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;}
.pub-status.err{display:flex;background:#fff5f5;border:1px solid #fecaca;color:var(--red);}
.pub-status svg{width:14px;height:14px;flex-shrink:0;}

/* BULK ACTIONS */
.bulk{display:flex;gap:8px;align-items:center;margin-bottom:10px;padding:8px 12px;background:#fff;border:1px solid var(--bdr);border-radius:6px;}
.bulk-lbl{font-size:.72rem;color:var(--mut);}
.bulk-btn{padding:3px 10px;border-radius:4px;border:1px solid var(--bdr);background:#fff;color:var(--txt);font-size:.72rem;cursor:pointer;transition:all .15s;}
.bulk-btn:hover{border-color:var(--acc);color:var(--acc);}
.hidden-count{margin-left:auto;font-size:.72rem;color:var(--red);}

/* TABLE */
.wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--bdr);}
table{width:100%;border-collapse:collapse;background:#fff;}
thead th{padding:8px 11px;text-align:left;font-size:.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--bdr);background:#f8fafc;white-space:nowrap;}
tbody tr{border-bottom:1px solid #f1f5f9;transition:all .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#f8fafc;}
tbody tr.hidden-row{opacity:.4;background:#fff5f5;}
tbody td{padding:6px 11px;vertical-align:middle;}
.mn{font-weight:600;font-size:.84rem;line-height:1.4;}
.kb{font-family:monospace;font-size:.78rem;background:#f1f5f9;padding:2px 6px;border-radius:3px;border:1px solid var(--bdr);}
.q{font-size:.84rem;font-weight:700;}
.q.hi{color:var(--grn);}.q.md{color:var(--yel);}.q.lo{color:var(--red);}.q.ze{color:#9ca3af;}
.ms{color:var(--red);font-weight:700;}
textarea{width:100%;border:1px solid transparent;border-radius:4px;padding:3px 6px;font-size:.78rem;font-family:inherit;background:transparent;color:var(--txt);resize:none;min-height:28px;transition:all .15s;line-height:1.4;}
textarea:hover{border-color:var(--bdr);background:#f8fafc;}
textarea:focus{outline:none;border-color:var(--acc);background:#fff;}

/* TOGGLE SWITCH */
.toggle{position:relative;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;position:absolute;}
.slider{width:32px;height:17px;background:#d1d5db;border-radius:20px;transition:.2s;position:relative;}
.slider::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.2s;}
.toggle input:checked+.slider{background:var(--grn);}
.toggle input:checked+.slider::after{left:17px;}
.tog-lbl{font-size:.72rem;color:var(--mut);}
.toggle input:checked~.tog-lbl{color:var(--grn);font-weight:600;}

.toast{position:fixed;bottom:14px;right:14px;background:#111;color:#fff;padding:7px 14px;border-radius:6px;font-size:.78rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;}
.toast.on{opacity:1;}
.sb2{text-align:center;padding:50px 20px;background:#fff;border-radius:8px;border:1px solid var(--bdr);}
.sb2 .ic{font-size:2rem;margin-bottom:8px;opacity:.4;}
.sb2 h3{color:var(--mut);margin-bottom:4px;font-size:.95rem;}
.sb2 p{color:var(--mut);font-size:.78rem;}
.sb2.eb{background:#fff5f5;border-color:#fecaca;}
.sb2.eb h3{color:var(--red);}
.rb2{margin-top:10px;padding:6px 16px;background:var(--acc);border:none;border-radius:5px;color:#fff;font-size:.78rem;cursor:pointer;}
</style>
</head>
<body>

<header>
  <div><div class="logo">ALL <span>BIKES</span></div></div>
  <span class="abadge">ADMIN</span>
  <div style="display:flex;align-items:center;gap:5px;"><div class="dot"></div><span class="upd" id="upd">Ładowanie...</span></div>
  <div class="hr">
    <input type="text" id="gs" placeholder="🔍 Szukaj..." oninput="fr()">
    <div class="pill">Modeli: <strong id="tot">—</strong></div>
    <button class="ref-btn" id="rb" onclick="doRef()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      Odśwież dane
    </button>
    <button class="pub-btn" id="pubBtn" onclick="publishToClient()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>
      Opublikuj dla klientów
    </button>
  </div>
</header>

<!-- BANER URL Apps Script -->
<div class="banner" id="urlBanner">
  <span>⚙️ <strong>Krok 1:</strong> Wklej URL Apps Script (po wdrożeniu):</span>
  <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec" oninput="checkUrl()">
  <button class="save-url-btn" onclick="saveUrl()">Zapisz</button>
  <span id="urlStatus" style="font-size:.72rem;"></span>
</div>

<div class="tw"><div class="tabs" id="tc"></div></div>

<main>
  <div class="pub-status" id="pubStatus">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
    <span id="pubMsg"></span>
  </div>
  <div class="tb2">
    <span class="sl">Sortuj:</span>
    <button class="sb act" onclick="ss('m',this)">Nazwa A–Z</button>
    <button class="sb" onclick="ss('qd',this)">Ilość ↓</button>
    <button class="sb" onclick="ss('qa',this)">Ilość ↑</button>
    <button class="sb" onclick="ss('k',this)">Kod</button>
    <span class="ri" id="ri"></span>
  </div>
  <div class="bulk">
    <span class="bulk-lbl">Zaznacz wszystkie:</span>
    <button class="bulk-btn" onclick="toggleAll(true)">✓ Pokaż klientowi</button>
    <button class="bulk-btn" onclick="toggleAll(false)">✗ Ukryj wszystkie</button>
    <span class="hidden-count" id="hiddenCnt"></span>
  </div>
  <div id="tbl"></div>
</main>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────
const SRC_PID = '2PACX-1vRnrlNfq8WTG7A21redQ7NN3CHTMkSd6wBbJBrZjlCOqMtBSLlEyamAc9CxbW_WkkQNzQ_C0QP_fbO8';
const SHOP_ID = 1001;
const TTL     = 5 * 60 * 1000;

const SHEETS = [
  {n:'KROSS',g:'639678047'},{n:'ROMET',g:'200097009'},{n:'TABOU',g:'0'},
  {n:'ONILUS',g:'1567847413'},{n:'SAVENO',g:'1691154286'},{n:'MERIDA',g:'463317300'},
  {n:'SEKTOR/SVR',g:'1282906237'},{n:'CYCLISION',g:'659526657'},{n:'SHOCKBLAZE',g:'1853541441'},
  {n:'SUPERIOR',g:'1849430619'},{n:'ECOBIKE/Barton/Ovivo',g:'956695839'},{n:'GHOST',g:'1389666850'},
  {n:'NS BIKES',g:'586926030'},{n:'DARTMOOR',g:'1855825315'},{n:'LAPIERRE',g:'1260342292'},
  {n:'MONDRAKER',g:'908839319'},{n:'CORRATEC',g:'686927495'},{n:'OVERFLY',g:'1966270566'},
  {n:'HB',g:'1418335042'},{n:'STORM',g:'910973918'},{n:'MBike',g:'740737223'},
  {n:'CTM',g:'585224939'},{n:'ORBEA',g:'1820443307'},{n:'DEMA',g:'1741272744'},
  {n:'AMULET',g:'2047892159'},{n:'CORELLI',g:'63727180'},{n:'12"-20"',g:'1677039807'},
  {n:'Puky',g:'1904402002'},{n:'Karbon',g:'2064890087'},{n:'Cossack',g:'1515110268'},
];

// ── STATE ─────────────────────────────────────────────────────────────
let cur='KROSS', srt='m', sq='';
const cache={}, cnts={}, hidden={};  // hidden[sheetName][kod] = true/false

// ── SCRIPT URL ────────────────────────────────────────────────────────
function getUrl(){try{return localStorage.getItem('appsScriptUrl')||'';}catch(e){return '';}}
function saveUrl(){
  const v=document.getElementById('scriptUrl').value.trim();
  if(!v.includes('script.google.com')){showToast('⚠️ Nieprawidłowy URL');return;}
  try{localStorage.setItem('appsScriptUrl',v);}catch(e){}
  document.getElementById('urlStatus').textContent='✓ Zapisano';
  document.getElementById('urlStatus').style.color='#16a34a';
  document.getElementById('scriptUrl').classList.add('ok');
  document.getElementById('urlBanner').style.background='#f0fdf4';
  document.getElementById('urlBanner').style.borderColor='#bbf7d0';
}
function checkUrl(){
  const v=document.getElementById('scriptUrl').value.trim();
  if(v.includes('script.google.com')){
    document.getElementById('urlStatus').textContent='✓ OK';
    document.getElementById('urlStatus').style.color='#16a34a';
  }
}
// Załaduj zapisany URL
window.addEventListener('load',()=>{
  const u=getUrl();
  if(u){
    document.getElementById('scriptUrl').value=u;
    document.getElementById('scriptUrl').classList.add('ok');
    document.getElementById('urlStatus').textContent='✓ Zapisano';
    document.getElementById('urlStatus').style.color='#16a34a';
    document.getElementById('urlBanner').style.background='#f0fdf4';
    document.getElementById('urlBanner').style.borderColor='#bbf7d0';
  }
});

// ── CSV PARSER ────────────────────────────────────────────────────────
const SKIP=/^(model|kod|ilo[śs][ćc]|dostawy?|dostawa|pozycja|d[oó][łl]|cena|g[oó]ra|całkowita)(\s|$)/i;

function csv(txt){
  return txt.split('\n').map(l=>{
    const c=[];let s='',q=false;
    for(const ch of l){if(ch==='"'){q=!q;continue;}if(ch===','&&!q){c.push(s.trim());s='';continue;}s+=ch;}
    c.push(s.trim());return c;
  }).filter(r=>r.some(c=>c));
}
function parse(rows){
  if(!rows.length)return[];
  let hdr=-1,kc=1,ic=2;
  for(let i=0;i<Math.min(8,rows.length);i++){
    for(let j=0;j<rows[i].length;j++){if(rows[i][j].toLowerCase()==='kod'){hdr=i;kc=j;break;}}
    if(hdr>=0)break;
  }
  if(hdr>=0){for(let j=kc+1;j<Math.min(kc+4,rows[hdr].length);j++){if(rows[hdr][j].toLowerCase().includes('ilo')){ic=j;break;}}}
  const bikes=[];
  for(let i=Math.max(hdr+1,1);i<rows.length;i++){
    const r=rows[i];
    const m=(r[0]||'').trim();
    if(!m)continue;
    if(SKIP.test(m))continue;
    const k=(r[kc]||'').toString().trim();
    if(!k&&!/\d/.test(m)&&m.split(' ').length<=3)continue;
    const il=(r[ic]||'').toString().trim();
    bikes.push({m,k:k||'?',il:il||'?'});
  }
  return bikes;
}

// ── FETCH ─────────────────────────────────────────────────────────────
async function fetchS(name,force=false){
  const c=cache[name];
  if(!force&&c&&Date.now()-c.ts<TTL)return c.data;
  const sh=SHEETS.find(s=>s.n===name);
  const r=await fetch(`https://docs.google.com/spreadsheets/d/e/${SRC_PID}/pub?output=csv&gid=${sh.g}`);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const data=parse(csv(await r.text()));
  cache[name]={data,ts:Date.now()};
  return data;
}

// ── HIDDEN STATE ──────────────────────────────────────────────────────
function isHidden(sheet,kod){
  if(!hidden[sheet])hidden[sheet]={};
  return hidden[sheet][kod]===true;
}
function setHidden(sheet,kod,val){
  if(!hidden[sheet])hidden[sheet]={};
  hidden[sheet][kod]=val;
  try{localStorage.setItem('hidden_'+sheet+'_'+kod, val?'1':'0');}catch(e){}
  updateHiddenCount();
}
function loadHiddenState(sheet,bikes){
  bikes.forEach(b=>{
    try{
      const v=localStorage.getItem('hidden_'+sheet+'_'+b.k);
      if(!hidden[sheet])hidden[sheet]={};
      hidden[sheet][b.k]= v==='1';
    }catch(e){}
  });
}
function toggleAll(show){
  const c=cache[cur];if(!c)return;
  c.data.forEach(b=>setHidden(cur,b.k,!show));
  render(c.data);
}
function updateHiddenCount(){
  const c=cache[cur];if(!c)return;
  const n=c.data.filter(b=>isHidden(cur,b.k)).length;
  document.getElementById('hiddenCnt').textContent=n>0?`${n} ukrytych`:'';
}

// ── NOTES ─────────────────────────────────────────────────────────────
function gN(s,k){try{return localStorage.getItem('nb_'+s+'_'+k)||'';}catch(e){return'';}}
function sN(s,k,v){
  try{localStorage.setItem('nb_'+s+'_'+k,v);}catch(e){}
  showToast('✓ Uwaga zapisana');
}

// ── SORT/FILTER ───────────────────────────────────────────────────────
function apF(a){if(!sq)return a;const q=sq.toLowerCase();return a.filter(b=>b.m.toLowerCase().includes(q)||b.k.toLowerCase().includes(q));}
function apS(a){const r=[...a];
  if(srt==='m')r.sort((x,y)=>x.m.localeCompare(y.m,'pl'));
  if(srt==='qd')r.sort((x,y)=>(parseInt(y.il)||0)-(parseInt(x.il)||0));
  if(srt==='qa')r.sort((x,y)=>(parseInt(x.il)||0)-(parseInt(y.il)||0));
  if(srt==='k')r.sort((x,y)=>x.k.localeCompare(y.k));
  return r;
}
function qcl(v){const n=parseInt(v);if(isNaN(n)||v==='?')return'';if(n===0)return'ze';if(n>=4)return'hi';if(n>=2)return'md';return'lo';}

// ── RENDER ────────────────────────────────────────────────────────────
function render(bikes){
  const cont=document.getElementById('tbl');
  const f=apF(bikes),s=apS(f);
  const vis=s.filter(b=>!isHidden(cur,b.k)).length;
  document.getElementById('ri').textContent=`Widocznych dla klienta: ${vis} / ${s.length}`;
  updateHiddenCount();
  if(!s.length){cont.innerHTML=`<div class="sb2"><div class="ic">🔍</div><h3>Brak wyników</h3></div>`;return;}

  let h=`<div class="wrap"><table><thead><tr>
    <th style="width:36px">#</th>
    <th style="width:100px">Widoczny</th>
    <th>Model</th>
    <th>Kod</th>
    <th>Ilość</th>
    <th style="min-width:150px">Uwagi (tylko admin)</th>
  </tr></thead><tbody>`;

  s.forEach((b,i)=>{
    const hid=isHidden(cur,b.k);
    const qc=qcl(b.il);
    const q=b.il==='?'?'<span class="ms">?</span>':`<span class="q ${qc}">${b.il}&nbsp;szt.</span>`;
    const k=b.k==='?'?'<span class="ms">?</span>':`<span class="kb">${b.k}</span>`;
    const note=gN(cur,b.k).replace(/"/g,'&quot;').replace(/</g,'&lt;');
    const ke=b.k.replace(/'/g,"\\'").replace(/\\/g,'\\\\');
    const chk=hid?'':'checked';
    h+=`<tr class="${hid?'hidden-row':''}">
      <td style="color:#9ca3af;font-size:.72rem">${i+1}</td>
      <td>
        <label class="toggle">
          <input type="checkbox" ${chk} onchange="setHidden('${cur}','${ke}',!this.checked);document.querySelector('tr:nth-child(${i+1})').classList.toggle('hidden-row',!this.checked);updateHidden()">
          <span class="slider"></span>
          <span class="tog-lbl">${hid?'Ukryty':'Widoczny'}</span>
        </label>
      </td>
      <td><div class="mn">${b.m}</div></td>
      <td>${k}</td>
      <td>${q}</td>
      <td><textarea rows="1" placeholder="Uwaga wewnętrzna..." onchange="sN('${cur}','${ke}',this.value)" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">${note}</textarea></td>
    </tr>`;
  });
  h+='</tbody></table></div>';
  cont.innerHTML=h;
}

function updateHidden(){
  // Odśwież licznik i etykiety po zmianie toggle
  const c=cache[cur];if(c)updateHiddenCount();
  // Aktualizuj ri
  const c2=cache[cur];if(!c2)return;
  const s=apS(apF(c2.data));
  const vis=s.filter(b=>!isHidden(cur,b.k)).length;
  document.getElementById('ri').textContent=`Widocznych dla klienta: ${vis} / ${s.length}`;
}

// ── LOAD SHEET ────────────────────────────────────────────────────────
async function load(name,force=false){
  document.getElementById('tbl').innerHTML=`<div class="sb2"><div class="ic">⏳</div><h3>Pobieranie — ${name}</h3></div>`;
  try{
    const bikes=await fetchS(name,force);
    loadHiddenState(name,bikes);
    cnts[name]=bikes.length;
    const sh=SHEETS.find(s=>s.n===name);
    const el=document.getElementById('cn_'+sh.g);if(el)el.textContent=bikes.length;
    document.getElementById('tot').textContent=Object.values(cnts).reduce((a,b)=>a+b,0)||'—';
    document.getElementById('upd').textContent='Źródło: '+new Date().toLocaleTimeString('pl-PL');
    if(!bikes.length){document.getElementById('tbl').innerHTML=`<div class="sb2"><div class="ic">📋</div><h3>Brak danych — ${name}</h3></div>`;return;}
    render(bikes);
  }catch(e){
    document.getElementById('tbl').innerHTML=`<div class="sb2 eb"><div class="ic">⚠️</div><h3>Błąd — ${name}</h3><p>${e.message}</p><button class="rb2" onclick="load('${name}',true)">Ponów</button></div>`;
  }
}

// ── PUBLISH ───────────────────────────────────────────────────────────
async function publishToClient(){
  const url=getUrl();
  if(!url){
    showToast('⚠️ Najpierw wklej URL Apps Script!');
    document.getElementById('scriptUrl').focus();
    return;
  }
  const btn=document.getElementById('pubBtn');
  btn.disabled=true;
  btn.classList.add('loading');
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg> Publikowanie...';

  // Zbierz wszystkie zatwierdzone rowery ze wszystkich marek
  const allBikes=[];
  SHEETS.forEach(sh=>{
    const c=cache[sh.n];
    if(!c)return;
    c.data.forEach(b=>{
      if(!isHidden(sh.n,b.k)){
        allBikes.push({brand:sh.n, m:b.m, k:b.k, il:b.il});
      }
    });
  });

  try{
    await fetch(url,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(allBikes)
    });
    showPubStatus(true, `✓ Opublikowano ${allBikes.length} rowerów — ${new Date().toLocaleTimeString('pl-PL')}`);
    try{localStorage.setItem('lastPublish',new Date().toISOString());}catch(e){}
  }catch(e){
    showPubStatus(false,'⚠️ Błąd połączenia z Apps Script: '+e.message);
  }
  btn.disabled=false;
  btn.classList.remove('loading');
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5m-7 7 7-7 7 7"/></svg> Opublikuj dla klientów';
}

function showPubStatus(ok,msg){
  const el=document.getElementById('pubStatus');
  el.className='pub-status '+(ok?'ok':'err');
  document.getElementById('pubMsg').textContent=msg;
  setTimeout(()=>el.style.display='none',8000);
}

// ── TABS / CONTROLS ───────────────────────────────────────────────────
function buildTabs(){
  const c=document.getElementById('tc');c.innerHTML='';
  SHEETS.forEach(sh=>{
    const b=document.createElement('button');
    b.className='tab'+(sh.n===cur?' act':'');
    b.id='t_'+sh.g;
    b.innerHTML=sh.n+`<span class="n" id="cn_${sh.g}">—</span>`;
    b.onclick=()=>{cur=sh.n;sq='';document.getElementById('gs').value='';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('act'));b.classList.add('act');load(sh.n);};
    c.appendChild(b);
  });
}
function fr(){sq=document.getElementById('gs').value;const c=cache[cur];if(c)render(c.data);}
function ss(t,btn){srt=t;document.querySelectorAll('.sb').forEach(b=>b.classList.remove('act'));btn.classList.add('act');const c=cache[cur];if(c)render(c.data);}
async function doRef(){const b=document.getElementById('rb');b.classList.add('spin');await load(cur,true);b.classList.remove('spin');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000);}
setInterval(()=>{if(document.visibilityState==='visible')load(cur,true);},TTL);
buildTabs();load(cur);
</script>
